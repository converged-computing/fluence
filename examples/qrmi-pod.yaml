# A QRMI workload scheduled by fluence. The pod requests a qpu and names no
# backend. fluence picks one, the webhook injects FLUXION_BACKEND and
# FLUXION_QRMI_TYPE, and examples/qrmi-workload/sampler.py acquires a QRMI
# session on that backend with the credentials from the Secret (in the user's space).
# This then runs a Bell circuit, and releases the session.

# Usage:
#   kubectl create secret generic ibm-quantum --from-literal=token="$IBM_CLOUD_TOKEN" --from-literal=crn="$IBM_CLOUD_CRN"
#   kubectl apply -f examples/qrmi-pod.yaml
#   kubectl logs -f qrmi-sampler
apiVersion: v1
kind: Pod
metadata:
  name: qrmi-sampler
  annotations:
    # the workload speaks qiskit-runtime-service, so ask for an IBM backend
    fluence.flux-framework.org/require-qrmi_type: qiskit-runtime-service
spec:
  schedulerName: fluence
  restartPolicy: Never
  containers:
    - name: sampler
      image: ghcr.io/converged-computing/fluence-qrmi-workload:latest
      args: ["--shots", "100"]
      env:
        - name: IBM_CLOUD_TOKEN
          valueFrom: {secretKeyRef: {name: ibm-quantum, key: token, optional: true}}
        - name: IBM_CLOUD_CRN
          valueFrom: {secretKeyRef: {name: ibm-quantum, key: crn, optional: true}}
      resources:
        requests:
          cpu: "1"
          fluxion.flux-framework.org/qpu: "1"
        limits:
          fluxion.flux-framework.org/qpu: "1"
