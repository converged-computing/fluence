# Shared-coordination quantum gang for IBM Quantum via QRMI
apiVersion: v1
kind: Pod
metadata:
  name: qrmi-gang-0
  labels:
    app: qrmi-gang
    fluence.flux-framework.org/group: qrmi-gang
  annotations:
    fluence.flux-framework.org/group-size: "2"
    fluence.flux-framework.org/coordination: shared
    fluence.flux-framework.org/require-qrmi_type: qiskit-runtime-service
    batch.kubernetes.io/job-completion-index: "0"   # -> scout
spec:
  schedulerName: fluence
  restartPolicy: Never
  containers:
    - name: app
      image: busybox
      command: ["sh", "-c", "echo qrmi gang member (role=$FLUENCE_COORDINATION_ROLE); sleep 600"]
      resources:
        requests: {fluxion.flux-framework.org/qpu: "1"}
        limits:   {fluxion.flux-framework.org/qpu: "1"}
---
apiVersion: v1
kind: Pod
metadata:
  name: qrmi-gang-1
  labels:
    app: qrmi-gang
    fluence.flux-framework.org/group: qrmi-gang
  annotations:
    fluence.flux-framework.org/group-size: "2"
    fluence.flux-framework.org/coordination: shared
    fluence.flux-framework.org/require-qrmi_type: qiskit-runtime-service
    batch.kubernetes.io/job-completion-index: "1"   # -> worker
spec:
  schedulerName: fluence
  restartPolicy: Never
  containers:
    - name: app
      image: busybox
      # A worker fetches the shared result by id (FLUENCE_QUANTUM_JOB_ID) and,
      # for a paid session, may reuse FLUENCE_QUANTUM_SESSION_ID for priority.
      command: ["sh", "-c", "echo qrmi gang member (role=$FLUENCE_COORDINATION_ROLE job=$FLUENCE_QUANTUM_JOB_ID); sleep 600"]
      resources:
        requests: {fluxion.flux-framework.org/qpu: "1"}
        limits:   {fluxion.flux-framework.org/qpu: "1"}
