# Two gangs that cannot both place. The test fills in GANG_CPU so one pod fills
# a worker. One gang places entirely, the loser stays FULLY pending, never partial.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gang-a
spec:
  replicas: 2
  selector: {matchLabels: {app: gang-a}}
  template:
    metadata:
      labels: {app: gang-a, fluence.flux-framework.org/group: gang-a}
      annotations: {fluence.flux-framework.org/group-size: "2"}
    spec:
      schedulerName: fluence
      containers:
        - name: w
          image: busybox
          command: ["sleep", "3600"]
          resources: {requests: {cpu: "${GANG_CPU}"}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gang-b
spec:
  replicas: 2
  selector: {matchLabels: {app: gang-b}}
  template:
    metadata:
      labels: {app: gang-b, fluence.flux-framework.org/group: gang-b}
      annotations: {fluence.flux-framework.org/group-size: "2"}
    spec:
      schedulerName: fluence
      containers:
        - name: w
          image: busybox
          command: ["sleep", "3600"]
          resources: {requests: {cpu: "${GANG_CPU}"}}
