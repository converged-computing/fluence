# The tutorial's gang. Two pods, a core and some memory each, on one node.
apiVersion: scheduling.k8s.io/v1alpha2
kind: PodGroup
metadata:
  name: onenode
spec:
  schedulingPolicy:
    gang:
      minCount: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onenode
spec:
  replicas: 2
  selector:
    matchLabels: {app: onenode}
  template:
    metadata:
      labels:
        app: onenode
    spec:
      schedulerName: fluence
      schedulingGroup:
        podGroupName: onenode
      containers:
        - name: worker
          image: busybox
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: "1"
              memory: 128Mi
