name: unit-tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # the base has flux-sched and Go. Build it here so a PR is tested with its own
      # flux-sched. Cached, so it only rebuilds when it changes.
      - name: Build base
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          provenance: false
          load: true
          tags: fluence-base:ci
          cache-from: type=gha,scope=base-linux-amd64
          cache-to: type=gha,mode=max,scope=base-linux-amd64

      - name: Go test
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e FLUX_SCHED_ROOT=/opt/flux-sched \
            -e LD_LIBRARY_PATH=/usr/lib:/opt/flux-sched/resource:/opt/flux-sched/resource/reapi/bindings:/opt/flux-sched/resource/libjobspec \
            fluence-base:ci bash -c 'export PATH=$PATH:/usr/local/go/bin && go version && make test'
